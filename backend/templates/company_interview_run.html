<div class="h-screen w-screen flex flex-col bg-slate-950 text-slate-100 overflow-hidden font-sans select-none animate-in fade-in duration-300">
    <!-- Top Bar -->
    <div class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 flex-shrink-0">
        <div class="flex items-center gap-3">
            <div id="run-logo-container" class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-sm font-bold"></div>
            <div>
                <span id="run-company-title" class="font-bold text-white text-base">Company Placement</span>
                <span class="mx-2 text-slate-700">|</span>
                <span id="run-round-title" class="text-xs font-semibold text-purple-400 uppercase tracking-wider">Round 1</span>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <!-- Timer -->
            <div id="run-timer-container" class="flex items-center gap-2 bg-red-950/30 border border-red-800/40 px-3 py-1.5 rounded-xl text-red-300 font-mono text-sm font-semibold">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                <span id="run-timer-display">00:00</span>
            </div>
            <!-- Fullscreen Exit Check -->
            <button onclick="quitInterviewRun()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-4 py-1.5 rounded-lg border border-slate-700 transition-colors">
                Quit Session
            </button>
        </div>
    </div>

    <!-- Main Container (Dual Panel) -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Left Panel: Problem Content and Input Fields -->
        <div class="flex-1 flex flex-col overflow-y-auto p-6 md:p-8 space-y-6">
            <div class="flex items-center justify-between">
                <span id="run-question-idx-header" class="text-xs font-bold text-slate-500 uppercase tracking-widest">Question 1 of 5</span>
                <span id="run-question-topic-badge" class="px-2.5 py-0.5 bg-slate-800 text-slate-400 text-xs rounded-full border border-slate-700">Topic</span>
            </div>

            <!-- Question Text -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-inner">
                <p id="run-question-text" class="text-slate-100 text-base leading-relaxed whitespace-pre-line"></p>
            </div>

            <!-- Answer Section (Changes dynamically based on round) -->
            <div id="run-answer-input-zone" class="flex-1">
                <!-- Inner HTML will be set dynamically (options list for MCQ, textarea for text, code editor for coding) -->
            </div>

            <!-- Navigation Controls -->
            <div class="flex items-center justify-between border-t border-slate-800 pt-6">
                <button id="run-btn-prev" onclick="jumpToRunQuestionOffset(-1)" class="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold rounded-xl transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                    ← Prev
                </button>
                <div class="flex gap-2">
                    <button onclick="clearCurrentAnswer()" class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 text-xs font-bold rounded-xl transition-colors">
                        Clear Answer
                    </button>
                    <button onclick="toggleMarkForReview()" class="px-4 py-2.5 bg-yellow-950/20 hover:bg-yellow-950/40 border border-yellow-800/40 text-yellow-300 text-xs font-bold rounded-xl transition-colors">
                        ⭐ Mark Review
                    </button>
                </div>
                <button id="run-btn-next" onclick="jumpToRunQuestionOffset(1)" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl transition-all shadow-lg hover:shadow-purple-500/20">
                    Next →
                </button>
            </div>
        </div>

        <!-- Right Panel: Question Palette, Status, Submission -->
        <div class="w-80 bg-slate-900 border-l border-slate-800 flex flex-col justify-between flex-shrink-0 p-6">
            <div class="space-y-6">
                <div>
                    <h3 class="font-bold text-white text-sm mb-3">Question Palette</h3>
                    <div id="run-palette-grid" class="grid grid-cols-5 gap-2">
                        <!-- Questions buttons injected here -->
                    </div>
                </div>

                <!-- Legend status -->
                <div class="space-y-2 border-t border-slate-800 pt-4">
                    <div class="flex items-center gap-3 text-xs text-slate-400">
                        <span class="w-3.5 h-3.5 rounded bg-green-600"></span> Answered
                    </div>
                    <div class="flex items-center gap-3 text-xs text-slate-400">
                        <span class="w-3.5 h-3.5 rounded bg-slate-800 border border-slate-700"></span> Not Answered
                    </div>
                    <div class="flex items-center gap-3 text-xs text-slate-400">
                        <span class="w-3.5 h-3.5 rounded bg-yellow-600"></span> Marked for Review
                    </div>
                </div>
            </div>

            <!-- Submit Panel -->
            <div class="space-y-3 border-t border-slate-800 pt-4">
                <p class="text-xs text-slate-500 leading-normal">Submit your answers before the countdown expires. Unsubmitted questions will be auto-saved.</p>
                <button onclick="submitCompanyRoundSession()" class="w-full py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-xl transition-all shadow-lg hover:shadow-green-500/25 active:scale-95 text-sm">
                    Submit Round Assessment
                </button>
            </div>
        </div>
    </div>
</div>
