<div class="w-full max-w-5xl mx-auto space-y-8 animate-in fade-in duration-500">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-slate-800 pb-6">
        <div>
            <button onclick="renderRounds()" class="flex items-center gap-2 text-slate-400 hover:text-white text-sm transition-colors mb-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                Back to Hub
            </button>
            <h1 class="text-3xl font-black text-white">Company placement Assessments</h1>
            <p class="text-slate-400 mt-1">Simulate official interview loops from major tech companies.</p>
        </div>
    </div>

    <!-- Search & Filters -->
    <div class="flex flex-col md:flex-row gap-4 bg-slate-900 border border-slate-800 p-4 rounded-2xl">
        <div class="flex-1 relative">
            <input type="text" id="company-search-input" oninput="filterCompanies()" placeholder="Search company by name (e.g. Google, TCS, Zoho)..."
                class="w-full bg-slate-800 border border-slate-700 text-white pl-10 pr-4 py-3 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none placeholder-slate-500 text-sm">
            <svg class="w-5 h-5 text-slate-500 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <div class="flex gap-2 overflow-x-auto pb-1 md:pb-0" id="category-filter-tabs">
            <button onclick="filterCategory('All')" class="category-tab px-4 py-2 text-xs font-bold rounded-lg transition-colors bg-purple-600 text-white" data-cat="All">All</button>
            <button onclick="filterCategory('Product')" class="category-tab px-4 py-2 text-xs font-bold rounded-lg transition-colors bg-slate-800 text-slate-300 hover:bg-slate-700" data-cat="Product">Product</button>
            <button onclick="filterCategory('Service')" class="category-tab px-4 py-2 text-xs font-bold rounded-lg transition-colors bg-slate-800 text-slate-300 hover:bg-slate-700" data-cat="Service">Service</button>
            <button onclick="filterCategory('Startup')" class="category-tab px-4 py-2 text-xs font-bold rounded-lg transition-colors bg-slate-800 text-slate-300 hover:bg-slate-700" data-cat="Startup">Startup</button>
        </div>
    </div>

    <!-- Company Grid Container -->
    <div id="company-list-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full py-20 text-center"><div class="loader mx-auto mb-4"></div><p class="text-slate-400">Loading placement programs...</p></div>
    </div>
</div>
