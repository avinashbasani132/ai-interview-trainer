services:
  - type: web
    name: ai-interview-trainer
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt && npm --prefix frontend-react install && npm --prefix frontend-react run build
    startCommand: gunicorn --chdir backend "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false   # Set manually in Render dashboard with your real password
      - key: GEMINI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
